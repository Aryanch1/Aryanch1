<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 310" width="588" height="310">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2a78"/><stop offset="100%" stop-color="#74306e"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;80%;0%" dur="17s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="p3orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfa8ff" stop-opacity="0.55"/><stop offset="100%" stop-color="#cfa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p3sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p3gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="p3clip"><rect width="588" height="310" rx="18"/></clipPath>
  </defs>
  <rect width="588" height="310" rx="18" fill="url(#p3bg)"/>
  <g clip-path="url(#p3clip)">
    <circle cx="520" cy="30" r="130" fill="url(#p3orb)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-26,16;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="300" r="110" fill="url(#p3orb)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0;20,-14;0,0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="588" height="150" fill="url(#p3gloss)"/>
    <g transform="rotate(18 294 155)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-820;820;820" keyTimes="0;0.32;1" dur="7s" begin="-4s" repeatCount="indefinite"/>
        <rect x="240" y="-220" width="120" height="760" fill="url(#p3sheen)"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="586" height="308" rx="17" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1.6"/>
  <line x1="26" y1="2.5" x2="562" y2="2.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.4"/>
  <text x="36" y="50" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="11.5" letter-spacing="2.5" fill="#cfa8ff">MOBILE &#183; AUTHENTICATION</text>
  <rect x="429" y="30" width="123" height="24" rx="12" fill="rgba(0,0,0,0.30)" stroke="#cfa8ff" stroke-width="1"/>
  <text x="490.5" y="46" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#cfa8ff">FLUTTER APP</text>
  <text x="36" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#ffffff">Proton</text>
    <text x="36" y="150" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">Flutter + Firebase authentication app with</text>
    <text x="36" y="177" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">login, signup and password-recovery flows</text>
    <text x="36" y="204" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">for Android, iOS and the web.</text>
    <rect x="36" y="248" width="75" height="27" rx="13" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <text x="73.5" y="266" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff">Flutter</text>
    <rect x="121" y="248" width="82" height="27" rx="13" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <text x="162.0" y="266" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff">Firebase</text>
    <rect x="213" y="248" width="54" height="27" rx="13" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <text x="240.0" y="266" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff">Dart</text>
