  <text x="36" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#ffffff">Smart Hotel Agent</text>
    <text x="36" y="150" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">Python AI agent that searches, compares and</text>
    <text x="36" y="177" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">books hotels across four sources through a</text>
    <text x="36" y="204" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e9effc">conversational interface.</text>
