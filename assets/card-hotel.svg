<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 310" width="588" height="310">
  <defs>
    <linearGradient id="h4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54400f"/><stop offset="100%" stop-color="#8a6414"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;80%;0%" dur="17s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="h4orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.55"/><stop offset="100%" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h4sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h4gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="h4clip"><rect width="588" height="310" rx="18"/></clipPath>
  </defs>
  <rect width="588" height="310" rx="18" fill="url(#h4bg)"/>
